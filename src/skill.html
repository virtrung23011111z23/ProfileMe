<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resume Interface</title>
  <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.development.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body className="bg-gray-900 text-white p-6">
  <div id="root"></div>
  <script type="text/babel" data-type="module">
    // Định nghĩa interface cho dữ liệu
    const ExperienceItemProps = ({ title, timeframe, description }) => ({
      title: String(title),
      timeframe: String(timeframe),
      description: String(description),
    });

    const SkillItemProps = ({ name, percentage }) => ({
      name: String(name),
      percentage: Number(percentage),
    });

    // Component ExperienceItem
    const ExperienceItem = ({ title, timeframe, description }) => {
      return (
        <div className="relative mb-8 pl-8">
          <div className="absolute left-0 top-2 w-3 h-3 rounded-full bg-orange-400"></div>
          <h3 className="text-lg font-semibold">{title}</h3>
          <p className="text-sm text-gray-400">{timeframe}</p>
          <p className="text-base">{description}</p>
        </div>
      );
    };

    // Component SkillItem
    const SkillItem = ({ name, percentage }) => {
      return (
        <div className="mb-4">
          <div className="flex justify-between mb-1">
            <span>{name}</span>
            <span>{percentage}%</span>
          </div>
          <div className="w-full bg-gray-700 h-2 rounded-full">
            <div
              className="bg-orange-400 h-2 rounded-full"
              style={{ width: `${percentage}%` }}
            ></div>
          </div>
        </div>
      );
    };

    // Component ExperienceSection
    const ExperienceSection = ({ experiences }) => {
      return (
        <div className="mb-12">
          <h2 className="text-2xl font-bold flex items-center">
            <span className="inline-block w-6 h-6 mr-2 bg-orange-400 rounded"></span>
            Experience
          </h2>
          <div className="relative">
            <div className="absolute left-1 top-0 bottom-0 w-0.5 bg-orange-400"></div>
            {experiences.map((exp, index) => (
              <ExperienceItem key={index} {...exp} />
            ))}
          </div>
        </div>
      );
    };

    // Component SkillsSection
    const SkillsSection = ({ skills }) => {
      return (
        <div>
          <h2 className="text-2xl font-bold">My Skills</h2>
          <div className="mt-4">
            {skills.map((skill, index) => (
              <SkillItem key={index} {...skill} />
            ))}
          </div>
        </div>
      );
    };

    // Component chính ResumeComponent
    const ResumeComponent = () => {
      const experiences = [
        {
          title: "Creative Director",
          timeframe: "2015 – Present",
          description: "Nemo enim ipsam voluptatem blanditiis praesentium voluptum delenit atque corrupti, quos dolores et quas molestias exceptur.",
        },
        {
          title: "Art Director",
          timeframe: "2013 – 2015",
          description: "Nemo enim ipsam voluptatem blanditiis praesentium voluptum delenit atque corrupti, quos dolores et quas molestias exceptur.",
        },
        {
          title: "Web Designer",
          timeframe: "2010 – 2013",
          description: "Nemo enim ipsam voluptatem blanditiis praesentium voluptum delenit atque corrupti, quos dolores et quas molestias exceptur.",
        },
      ];

      const skills = [
        { name: "Web Design", percentage: 80 },
        { name: "Graphic Design", percentage: 70 },
        { name: "Branding", percentage: 90 },
        { name: "WordPress", percentage: 50 },
      ];

      return (
        <div className="max-w-2xl mx-auto">
          <ExperienceSection experiences={experiences} />
          <SkillsSection skills={skills} />
        </div>
      );
    };

    // Render ứng dụng
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ResumeComponent />);
  </script>
</body>
</html>
